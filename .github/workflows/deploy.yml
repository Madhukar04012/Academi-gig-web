name: Deploy
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with: node-version: 18
      - run: npm install
      - run: npm run build
      - run: npx firebase-tools deploy --only hosting,functions --token ${{ secrets.FIREBASE_TOKEN }}
